[project]
name = "trinity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xer0adon1s", email = "xer0adon1s@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "watchfiles>=1.2.0",
]

[project.scripts]
trinity = "trinity.cli.main:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
exclude = ["test/fixtures/"]

[tool.ruff.lint]
# First-pass rule set. Deferred for a later tighten: ANN, E501, D, RUF100.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "BLE"]

# Parallel Claude worktree owns these files (Fix 1/4). Ignore their
# pre-existing lint so this pass stays green without merge conflicts.
[tool.ruff.lint.per-file-ignores]
"src/trinity/intake.py" = ["UP017"]
"src/trinity/sharing.py" = ["E402"]
"test/unit/test_box_status_and_sharing.py" = ["B011", "F841"]
"test/unit/test_db_migration.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = [
    "src/trinity/tui/",
    "src/trinity/show_me.py",
]
